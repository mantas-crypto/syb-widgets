<div class="syl-quotes" data-reviews><figure class="syl-card"><p class="syl-tag"><b>Mantas’s Egypt trip</b>, Apr 2026</p><div class="syl-stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote><p>“<span class="syl-hl">Mantas</span>, Nikki, and Eli were the perfect team organized, welcoming, supportive, and genuinely fun to be around. They did an incredible job making sure everyone felt included and had a great time throughout the entire trip.”</p></blockquote><figcaption class="syl-who">Lily M. on <a data-syl="review-lily-m" href="https://www.google.com/maps/reviews/data=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT2tzMmFYbGFXSGN4TVhaUGRtWm5hekZOWm1ab1IwRRAB!2m1!1s0x0:0xb617168d1a505647!3m1!1s2@1:CAIQACodChtycF9oOks2aXlaWHcxMXZPdmZnazFNZmZoR0E%7C%7C" target="_blank" rel="noopener">Google</a></figcaption></figure><figure class="syl-card"><p class="syl-tag"><b>Mantas’s Egypt trip</b>, Apr 2026</p><div class="syl-stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote><p>“<span class="syl-hl">Mantas</span>, Eli, and Nikki made it an unforgettable trip!”</p></blockquote><figcaption class="syl-who">Danielle B. on <a data-syl="review-danielle-b" href="https://www.google.com/maps/reviews/data=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT2t0eWEzaHhjMFZvYVdGM1lWY3lXR2xyWjFoV1RXYxAB!2m1!1s0x0:0xb617168d1a505647!3m1!1s2@1:CAIQACodChtycF9oOktya3hxc0VoaWF3YVcyWGlrZ1hWTWc%7C%7C" target="_blank" rel="noopener">Google</a></figcaption></figure><figure class="syl-card"><p class="syl-tag"><b>Mantas’s Nicaragua trip</b>, Jan 2026</p><div class="syl-stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote><p>“The leaders also deserve a huge shoutout, <span class="syl-hl">Mantas</span>, Steph, Courtney, Sam, Eli, Duncan, Allison, Sav, Shriner and Matas and so many more across both trips.”</p></blockquote><figcaption class="syl-who">Ely G. on <a data-syl="review-ely-g" href="https://www.google.com/maps/reviews/data=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT25CUVVVeHZSSG80T1hoSGRFSTFlSGRZUmxkNE0wRRAB!2m1!1s0x0:0xb617168d1a505647!3m1!1s2@1:CAIQACodChtycF9oOnBQUUxvRHo4OXhHdEI1eHdYRld4M0E%7C0dSxtBBYuA5%7C" target="_blank" rel="noopener">Google</a></figcaption></figure><figure class="syl-card"><p class="syl-tag"><b>Mantas’s Nicaragua trip</b>, Nov 2025</p><div class="syl-stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote><p>“Everyone was awesome from the people that came from various parts of the world to the leaders <span class="syl-hl">Mantas</span>, Eli, Kaia, Nikki, Brianna, Holly. … The trip was filled with tough but fulfilling workouts (<span class="syl-hl">Mantas</span> will push you to the limit), great sunset yoga sessions, amazing breakfasts and dinners, surfing lessons for all levels and many other activities.”</p></blockquote><figcaption class="syl-who">Erand S. on <a data-syl="review-erand-s" href="https://www.google.com/maps/reviews/data=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT25wTVVXdHlNRkpHT0Zabk5HNXhXbGRQVldrd2NuYxAB!2m1!1s0x0:0xb617168d1a505647!3m1!1s2@1:CAIQACodChtycF9oOnpMUWtyMFJGOFZnNG5xWldPVWkwcnc%7C0dBj3jEnmZS%7C" target="_blank" rel="noopener">Google</a></figcaption></figure><figure class="syl-card"><p class="syl-tag"><b>Mantas’s Nicaragua trip</b>, Nov 2025</p><div class="syl-stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote><p>“SYB Nicaragua was my first ever solo trip so I was a little anxious at first, but the entire way - from speaking with <span class="syl-hl">Mantas</span> before booking, to meeting the shuttles in Liberia, to the entire week at the villas - I felt like I was supported in taking risks and becoming the best version of myself.”</p></blockquote><figcaption class="syl-who">Andrew S. on <a data-syl="review-andrew-s" href="https://www.google.com/maps/reviews/data=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT2pBdGJqZDNXSFZhY0UxNGMwdFZkMDFFTVRBMFNrRRAB!2m1!1s0x0:0xb617168d1a505647!3m1!1s2@1:CAIQACodChtycF9oOjAtbjd3WHVacE14c i / Sarah Cat / <span class="syl-hl">Mantas</span> / Steph / Courtney all made this trip INCREDIBLE. '10/10 reccomend for ANYONE you will not regret it!!! Everyday was more memorable than the last.”</p></blockquote><figcaption class="syl-who">Ilana G. on <a data-syl="review-ilana-g" href="https://www.google.com/maps/reviews/data=!4m8!14m7!1m6!2m5!1sCi9DQUlRQUNvZENodHljRjlvT2tGdUxXRnlOR1ZUZVVkVE5FeEllVTU2UjNaUk1sRRAB!2m1!1s0x0:0xb617168d1a505647!3m1!1s2@1:CAIQACodChtycF9oOkFuLWFyNGVTeUdTNExIeU56R3ZRMlE%7C%7C" target="_blank" rel="noopener">Google</a></figcaption></figure></div>
